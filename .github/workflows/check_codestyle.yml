name: 'Check: Codestyle'

# This check downloads its checker from musescore/framework_tmp, which is no
# longer publicly readable, so it cannot pass from this fork. It no longer runs
# on pull requests. Run it by hand once the checker is vendored or the source
# repository is reachable again.
on:
  workflow_dispatch:

jobs:
  codestyle:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - name: Fetch Muse CI scripts
      run: |
        cmake -P ./buildscripts/ci/checkcodestyle/ci_fetch.cmake

    - name: Test coding style
      run: |
        cmake -P ./buildscripts/ci/checkcodestyle/_deps/checkcodestyle.cmake ./src/
